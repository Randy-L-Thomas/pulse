# Pulse v1 probe targets — TK421 copy. Runtime config is %APPDATA%\pulse\probes.toml.
# This file is kept for reference; Settings → Preset TK421 loads presets/probes.tk421.toml.

height = 440
half_width = 960
full_width = 1920
monitor_width = 1920
monitor_height = 440
stale_secs = 1800

[net]
host = "google.com"
https_url = "https://www.google.com"
history = 48

# Path cell: DNS lookup of dns_host vs ICMP to the default gateway (not Google RTT).
# Yellow if DNS ≥ 80ms or gateway ≥ 40ms, or one of them fails. Red if both fail.
# Right-click the cell → Info for host, times, gateway IP, and status.
[path]
dns_host = "google.com"

# Disk left unused — utilization (CPU / RAM / GPU) is more useful on the strip.
# [disk]
# mount = "C:\\"
# warn_pct = 15.0
# crit_pct = 5.0

[cpu]
warn_pct = 80.0
crit_pct = 95.0

[memory]
warn_pct = 80.0
crit_pct = 95.0

[gpu]
warn_pct = 80.0
crit_pct = 95.0

# Cursor Desktop working-set (all Cursor.exe + helpers under the install).
# Tune without a rebuild. Electron has crashed around ~4 GB on this machine —
# warn early; red = crash neighborhood. Do not set crit below typical live usage
# or the cell stays red all day.
# Live working-set 2026-08-20: ~3.8 GB, so 2.5 warn / 3.8 crit would sit in red.
# 3.0 warn = yellow (getting dangerous); 4.0 crit = red (crash neighborhood).
[cursor]
warn_gb = 3.0
crit_gb = 4.0

[[http]]
id = "ice"
label = "ICE"
url = "http://127.0.0.1:3201/api/ping"
also = "http://127.0.0.1:5273/"
open = "http://127.0.0.1:5273"
start_program = "ice"
start_args = ["start"]
stop_program = "ice"
stop_args = ["stop"]
restart_program = "ice"
restart_args = ["restart"]
task = "ice-sa-app"

[[http]]
id = "cam"
label = "CAM"
url = "http://127.0.0.1:3001/api/health"
also = "http://127.0.0.1:5173/"
open = "http://127.0.0.1:5173"
open_fallback = "http://127.0.0.1:3001/api/health"
start_program = "CAM"
start_args = ["start"]
stop_program = "CAM"
stop_args = ["stop"]
restart_program = "CAM"
restart_args = ["restart"]
task = "cam-api"

[[http]]
id = "cam-mcp"
label = "cam-mcp"
url = "http://127.0.0.1:3101/health"
open = "http://127.0.0.1:3101/health"
start_program = "npm"
start_args = ["run", "mcp:http"]
start_cwd = "C:\\dev\\cam-mcp"
stdio_match = "cam-mcp"

