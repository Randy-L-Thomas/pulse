<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pulse</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar" data-tauri-drag-region>
        <span class="mark" data-tauri-drag-region>PULSE</span>
        <span id="clock" class="clock" data-tauri-drag-region></span>
        <div class="title-actions">
          <button type="button" id="btn-half" class="tb" title="Half — yield the right half of the strip">Half</button>
          <button type="button" id="btn-full" class="tb" title="Full — health + modules">Full</button>
          <button type="button" id="btn-settings" class="tb" title="Settings">Set</button>
          <button type="button" id="btn-update" class="tb" title="Check now — download and install if available">Upd</button>
          <button type="button" id="btn-pin" class="tb on" title="Stay on top of other windows" aria-pressed="true">Pin</button>
          <button type="button" id="btn-min" class="tb ico" title="Minimize">–</button>
          <button type="button" id="btn-close" class="tb ico" title="Close">×</button>
        </div>
      </header>
      <div id="workspace">
      <main class="body">
        <section class="trace" aria-label="Internet latency">
          <div class="trace-meta">
            <div class="trace-head">
              <span class="trace-label">NET</span>
              <span id="net-primary" class="trace-read">—</span>
            </div>
            <span id="net-detail" class="trace-sub"></span>
          </div>
          <div class="trace-spark">
            <canvas id="spark" width="200" height="72"></canvas>
          </div>
        </section>
        <section id="cells" class="cells" aria-label="Systems"></section>
      </main>
      <aside id="modules" hidden>
        <nav class="mod-switch" aria-label="Modules">
          <button type="button" class="mod-tab on" data-mod="translate">Translate</button>
          <button type="button" class="mod-tab" data-mod="ocr">OCR</button>
          <button type="button" class="mod-tab" data-mod="chat">Chat</button>
        </nav>
        <section id="mod-translate" class="mod-pane">
          <div class="mod-row mt-bar">
            <select id="mt-from" title="From">
              <option value="es">Mexican Spanish</option>
              <option value="en">English</option>
            </select>
            <button type="button" id="mt-swap" class="tb mt-swap" title="Swap languages">↔</button>
            <select id="mt-to" title="To">
              <option value="en">English</option>
              <option value="es">Mexican Spanish</option>
            </select>
            <button type="button" id="mt-copy" class="tb">Copy</button>
            <button type="button" id="mt-clear" class="tb">Clear</button>
            <span id="mt-status" class="hint mt-hint"></span>
          </div>
          <div class="mt-cols">
            <textarea id="mt-src" placeholder="Type or paste"></textarea>
            <textarea id="mt-dst" placeholder="Translation" readonly></textarea>
          </div>
        </section>
        <section id="mod-ocr" class="mod-pane" hidden>
          <div class="mod-row">
            <select id="ocr-win" class="wide"></select>
            <button type="button" id="ocr-bind" class="tb">Bind</button>
            <button type="button" id="ocr-go" class="tb on">OCR</button>
            <button type="button" id="ocr-to-mt" class="tb">Translate</button>
            <span id="ocr-status" class="hint"></span>
          </div>
          <textarea id="ocr-out" class="ocr-out" placeholder="WhatsApp capture"></textarea>
        </section>
        <section id="mod-chat" class="mod-pane" hidden>
          <div class="mod-row">
            <select id="chat-model"></select>
            <button type="button" id="chat-refresh" class="tb">Models</button>
            <span id="chat-status" class="hint"></span>
          </div>
          <div id="chat-log" class="chat-log"></div>
          <div class="mod-row">
            <input id="chat-in" type="text" placeholder="message" />
            <button type="button" id="chat-send" class="tb on">Send</button>
          </div>
        </section>
      </aside>
      </div>
    </div>
    <div id="radial" class="radial" hidden>
      <div class="radial-disc"></div>
      <button type="button" class="spoke" data-action="open" style="--a: -90deg">Open</button>
      <button type="button" class="spoke" data-action="start" style="--a: -18deg">Start</button>
      <button type="button" class="spoke" data-action="stop" style="--a: 54deg">Stop</button>
      <button type="button" class="spoke" data-action="restart" style="--a: 126deg">Restart</button>
      <button type="button" class="spoke" data-action="copy" style="--a: 198deg">Copy</button>
    </div>
    <div id="settings" class="settings" hidden>
      <header class="settings-head">
        <span>Settings</span>
        <nav class="settings-tabs">
          <button type="button" class="tb on" data-tab="general">General</button>
          <button type="button" class="tb" data-tab="cells">Cells</button>
          <button type="button" class="tb" data-tab="update">Update</button>
        </nav>
        <button type="button" id="btn-settings-close" class="tb">Close</button>
      </header>
      <div class="settings-body">
        <section id="tab-general" class="settings-tab">
          <div class="settings-row">
            <button type="button" id="set-half" class="tb">Half</button>
            <button type="button" id="set-full" class="tb">Full</button>
            <button type="button" id="set-pin" class="tb on">Pin</button>
            <label><input id="set-autostart" type="checkbox" /> Start with Windows</label>
          </div>
          <label>Strip width <input id="set-mon-w" type="number" min="800" max="3840" /></label>
          <label>Strip height max <input id="set-mon-h" type="number" min="400" max="600" /></label>
          <label>Allow start programs <input id="set-allow" class="wide" placeholder="cam, ice, npm" /></label>
          <label>Ollama URL <input id="set-ollama-url" class="wide" placeholder="http://127.0.0.1:11434" /></label>
          <div class="settings-row">
            <button type="button" id="btn-preset-tk421" class="tb">Preset TK421</button>
            <button type="button" id="btn-preset-generic" class="tb">Preset generic</button>
          </div>
          <p class="hint">TK421 loads ICE/CAM/Cursor. Generic is Net + host meters only. Saved to AppData. Start/Stop stay off unless the program is in Allow start.</p>
        </section>
        <section id="tab-cells" class="settings-tab" hidden>
          <div class="settings-row">
            <label><input id="show-path" type="checkbox" /> Path</label>
            <label><input id="show-cpu" type="checkbox" /> CPU</label>
            <label><input id="show-memory" type="checkbox" /> RAM</label>
            <label><input id="show-gpu" type="checkbox" /> GPU</label>
          </div>
          <div class="settings-row">
            <label>CPU warn% <input id="cpu-warn" type="number" /></label>
            <label>CPU crit% <input id="cpu-crit" type="number" /></label>
            <label>RAM warn% <input id="mem-warn" type="number" /></label>
            <label>RAM crit% <input id="mem-crit" type="number" /></label>
            <label>GPU warn% <input id="gpu-warn" type="number" /></label>
            <label>GPU crit% <input id="gpu-crit" type="number" /></label>
            <label>VRAM warn% <input id="gpu-vram-warn" type="number" /></label>
            <label>VRAM crit% <input id="gpu-vram-crit" type="number" /></label>
          </div>
          <h3>HTTP cells</h3>
          <div id="http-list" class="stack"></div>
          <button type="button" id="btn-add-http" class="tb">Add HTTP</button>
          <h3>Process RAM</h3>
          <div id="proc-list" class="stack"></div>
          <button type="button" id="btn-add-proc" class="tb">Add process</button>
        </section>
        <section id="tab-update" class="settings-tab" hidden>
          <p id="update-meta" class="hint"></p>
          <p class="hint">Check now reads a tagged GitHub Release, not a git push.</p>
          <p id="update-last" class="hint">last checked — never</p>
          <div class="settings-row">
            <button type="button" id="btn-check-update" class="tb">Check now</button>
            <button type="button" id="btn-open-releases" class="tb">Releases</button>
            <span id="update-status" class="hint"></span>
          </div>
        </section>
      </div>
      <footer class="settings-foot">
        <button type="button" id="btn-settings-save" class="tb on">Save</button>
      </footer>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
