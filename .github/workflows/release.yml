name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend
        run: npm ci

      - name: Import Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) {
            Write-Host "WINDOWS_PFX_BASE64 unset — unsigned NSIS (SmartScreen expected)"
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            throw "WINDOWS_PFX_PASSWORD is required when WINDOWS_PFX_BASE64 is set"
          }
          $dir = Join-Path $env:RUNNER_TEMP "pulse-codesign"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $pfx = Join-Path $dir "cert.pfx"
          $b64 = ($env:WINDOWS_PFX_BASE64 -replace "-----BEGIN [A-Z0-9 ]+-----", "" -replace "-----END [A-Z0-9 ]+-----", "" -replace "\s", "")
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($b64))
          $pwd = ConvertTo-SecureString -String $env:WINDOWS_PFX_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Remove-Item $pfx -Force
          $cfg = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 6 -Compress
          $cfgPath = Join-Path $dir "tauri-sign.json"
          [IO.File]::WriteAllText($cfgPath, $cfg)
          "TAURI_SIGN_CONFIG=$cfgPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Imported Authenticode cert thumbprint $($cert.Thumbprint)"

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Pulse ${{ github.ref_name }}
          releaseBody: |
            Windows installer (NSIS) and portable zip.

            First SmartScreen warning is expected until WINDOWS_PFX_BASE64 is set. WebView2 is already on Windows 10/11.
          releaseDraft: false
          prerelease: false
          args: ${{ env.TAURI_SIGN_CONFIG != '' && format('--bundles nsis --config {0}', env.TAURI_SIGN_CONFIG) || '--bundles nsis' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Portable zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $exe = "src-tauri/target/release/pulse.exe"
          if (-not (Test-Path $exe)) { throw "pulse.exe missing" }
          $out = "pulse-$ver-windows-x64.zip"
          Compress-Archive -Path $exe -DestinationPath $out -Force
          gh release upload "${{ github.ref_name }}" $out --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
